name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          ZIP=$(find . -maxdepth 1 -iname 'Don_Ren_Android_Studio_Project*.zip' -print -quit)
          test -n "$ZIP" || { echo "Project ZIP not found"; exit 1; }
          unzip -q "$ZIP"
          test -f don_ren_android_project/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      -       - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle --no-daemon -p don_ren_android_project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DonRen-RPG-debug-APK
          path: don_ren_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
